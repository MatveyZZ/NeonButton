<!DOCTYPE html> <!-- Объявление типа документа, указывающее, что это HTML5 -->
<html lang="en"> <!-- Начало HTML-документа с указанием языка (английский) -->
<head>
    <meta charset="UTF-8"> <!-- Установка кодировки документа на UTF-8 для поддержки различных символов -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Указание браузеру использовать последнюю версию рендеринга -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Настройка адаптивного дизайна для мобильных устройств -->
    <title>Neon Button</title> <!-- Заголовок страницы, отображаемый на вкладке браузера -->
    <link rel="stylesheet" href="style.css"> <!-- Подключение внешнего CSS-файла для стилизации страницы -->
</head>
<body>
    
    <div class="container"> <!-- Контейнер для кнопок, используется для группировки элементов -->
        <button class="btn btn-1">NEON EFFECT 1</button> <!-- Первая кнопка с классами для стилизации -->
        <button class="btn btn-2">NEON EFFECT 2</button> <!-- Вторая кнопка с классами для стилизации -->
    </div>
</body>
</html>
